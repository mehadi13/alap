server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: alap-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/alap_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:redis123}
      timeout: 3000ms
  jackson:
    default-property-inclusion: ALWAYS
    serialization:
      write-dates-as-timestamps: false

# ALAP Service Configuration
alap:
  jwt:
    secret: ${ALAP_JWT_SECRET:ALAP_SUPER_SECURE_JWT_SECRET_KEY_FOR_PRODUCTION_STABILITY_2026}
    expiration-ms: ${ALAP_JWT_EXPIRATION:86400000} # 24 hours
  discord:
    webhook-url: ${DISCORD_WEBHOOK_URL:https://discord.com/api/webhooks/1545255301899489432/YmsfHKIWUkvoD-ID9svZW53xF0f6JzfUwpYmSQb_574jn-yuxMW31YkbVgDvP8z6plup}

# Management & Health Endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    ai.alap.backend: DEBUG
    org.springframework.web: INFO
