version: '3.8'

services:
  # PostgreSQL Database Service
  postgres:
    image: postgres:16-alpine
    container_name: alap-postgres
    restart: always
    environment:
      POSTGRES_DB: alap_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d alap_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - alap-network

  # Redis Cache & Session Store Service
  redis:
    image: redis:7-alpine
    container_name: alap-redis
    restart: always
    command: redis-server --requirepass redis123 --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis123", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - alap-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  alap-network:
    driver: bridge
