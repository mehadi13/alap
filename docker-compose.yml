services:
  # 1. PostgreSQL Database Service
  postgres:
    image: postgres:16-alpine
    container_name: alap-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-alap_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d alap_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - alap-network

  # 2. Redis Cache & Session Store Service
  redis:
    image: redis:7-alpine
    container_name: alap-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis123} --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - alap-network

  # 3. Spring Boot Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: alap-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-alap_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
      ALAP_JWT_SECRET: ${ALAP_JWT_SECRET:-ALAP_SUPER_SECURE_JWT_SECRET_KEY_FOR_PRODUCTION_STABILITY_2026}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-https://discord.com/api/webhooks/1545255301899489432/YmsfHKIWUkvoD-ID9svZW53xF0f6JzfUwpYmSQb_574jn-yuxMW31YkbVgDvP8z6plup}
    networks:
      - alap-network

  # 4. Next.js Landing & Consultation Frontend App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.alap.pro}
    container_name: alap-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3002:3002"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.alap.pro}
    networks:
      - alap-network

  # 5. Next.js Client Portal & Documentation Browser App
  client-app:
    build:
      context: ./client-app
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.alap.pro}
    container_name: alap-client-app
    restart: always
    depends_on:
      - backend
    ports:
      - "3001:3001"
    volumes:
      - ./docs:/app/docs:ro
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.alap.pro}
    networks:
      - alap-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  alap-network:
    driver: bridge
  dokploy-network:
    external: true
